
version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.14

    working_directory: ~/project

    steps:
      # Get project code from GitHub
      - checkout

      # Restore dependency cache
      - restore_cache:
          keys:
            - secure-code-factory-v1-{{ checksum "requirements.txt" }}
            - secure-code-factory-v1-

      # Install dependencies
      - run:
          name: Upgrade pip
          command: python -m pip install --upgrade pip

      - run:
          name: Install project dependencies
          command: python -m pip install -r requirements.txt

      # Save dependency cache
      - save_cache:
          key: secure-code-factory-v1-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip

      # Django configuration check
      - run:
          name: Check Django configuration
          command: python manage.py check

      # Verify migrations
      - run:
          name: Check database migrations
          command: python manage.py makemigrations --check --dry-run

      # Run CircleCI Smarter Testing
      - run:
          name: Run Django test suite
          command: circleci testsuite run "ci tests"

      # Upload test results to CircleCI
      - store_test_results:
          path: test-results

      # Keep test reports available for download
      - store_artifacts:
          path: test-results
          destination: junit-reports

workflows:
  secure-code-factory-ci:
    jobs:
      - build-and-test
