
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureFactory | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #101b30;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.25);
        }

        .brand {
            text-align: center;
            font-size: 25px;
            font-weight: 700;
            color: #101b30;
            margin-bottom: 8px;
        }

        .brand span {
            color: #25c4e8;
        }

        .subtitle {
            text-align: center;
            color: #8293ad;
            font-size: 12px;
            margin-bottom: 32px;
        }

        h2 {
            font-size: 20px;
            color: #17243a;
            margin-bottom: 8px;
        }

        .description {
            color: #8793a5;
            font-size: 13px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #34445c;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce3ed;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #25a9d1;
            box-shadow: 0 0 0 3px rgba(37,196,232,0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #137da9;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #10658a;
        }

        .error {
            background: #fde8e8;
            color: #c63b3b;
            padding: 11px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 18px;
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            color: #9aa5b5;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="brand">
            SECURE<span>FACTORY</span>
        </div>

        <div class="subtitle">
            SECURITY MONITORING SYSTEM
        </div>

        <h2>Welcome Back</h2>

        <p class="description">
            Sign in to access your security monitoring dashboard.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Sign In
            </button>

        </form>

        <div class="footer">
            Secure Code Factory Monitoring Dashboard<br>
            &copy; 2026 | Academic Prototype
        </div>

    </div>

</body>
</html>
